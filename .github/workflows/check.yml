name: Vérifications
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests de régression présents
        run: |
          if [ -d tests ]; then
            node --test tests/*.test.mjs
          fi
      - name: Vérifier le build
        run: npm run build:pages
        env:
          SKIP_LIVE_REVIEWS: "1"
